<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>直播管理</title>
<style>
  /* Minimalism & Swiss：石板灰中性色 + 蓝色操作色，密度偏高的后台布局。
     字体用系统字体：页面跑在路由器上、在局域网内使用，不依赖任何外网资源。 */
  :root {
    --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --text: #1e293b; --muted: #475569; --subtle: #64748b;
    --border: #e2e8f0; --primary: #2563eb; --primary-hover: #1d4ed8; --on-primary: #ffffff; --primary-soft: #eff6ff;
    --danger: #dc2626; --danger-soft: #fef2f2; --ok: #15803d; --star: #d97706; --ring: #2563eb;
    --side: #0f172a; --side-text: #cbd5e1; --side-muted: #94a3b8; --side-hover: #1e293b; --side-active: #2563eb;
    --radius: 8px; --shadow: 0 1px 2px rgba(15, 23, 42, .06);
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --sidebar-w: 232px; --topbar-h: 56px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1120; --surface: #111827; --surface-2: #1f2937; --text: #e5e7eb; --muted: #9ca3af; --subtle: #9ca3af;
      --border: #273244; --primary: #3b82f6; --primary-hover: #60a5fa; --on-primary: #ffffff; --primary-soft: #172554;
      --danger: #f87171; --danger-soft: #3b1212; --ok: #4ade80; --star: #fbbf24; --ring: #60a5fa;
      --side: #020617; --side-text: #cbd5e1; --side-muted: #94a3b8; --side-hover: #111827; --side-active: #2563eb;
      --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- 骨架 ---------- */
  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100%; }
  aside { background: var(--side); color: var(--side-text); position: sticky; top: 0; height: 100vh; overflow-y: auto;
          display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: var(--s2); height: var(--topbar-h); padding: 0 var(--s4);
           font-weight: 600; font-size: 15px; color: #fff; border-bottom: 1px solid rgba(148, 163, 184, .15); }
  .brand svg { color: #60a5fa; }
  .nav-sec { padding: var(--s3) var(--s2) var(--s1); }
  .nav-sec h2 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
                color: var(--side-muted); margin: var(--s2) var(--s2) var(--s2); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--side-hover);
         border-radius: var(--radius); padding: 3px; margin: 0 var(--s1); }
  .seg button { border: 0; background: transparent; color: var(--side-text); border-radius: 6px; padding: 6px 0;
                font: inherit; font-size: 13px; cursor: pointer; transition: background .15s, color .15s; }
  .seg button:hover { color: #fff; }
  .seg button[aria-pressed="true"] { background: var(--side-active); color: #fff; }
  .nav a { display: flex; align-items: center; gap: var(--s3); padding: 8px var(--s3); margin: 1px 0;
           border-radius: var(--radius); color: var(--side-text); text-decoration: none; transition: background .15s, color .15s; }
  .nav a:hover { background: var(--side-hover); color: #fff; }
  .nav a[aria-current="page"] { background: var(--side-hover); color: #fff; box-shadow: inset 3px 0 0 var(--side-active); }
  .nav .count { margin-left: auto; font-size: 12px; color: var(--side-muted); }
  .side-foot { margin-top: auto; padding: var(--s4); font-size: 12px; color: var(--side-muted);
               border-top: 1px solid rgba(148, 163, 184, .15); }
  .side-foot a { color: var(--side-text); }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 5; height: var(--topbar-h); display: flex; align-items: center; gap: var(--s3);
            padding: 0 var(--s5); background: var(--surface); border-bottom: 1px solid var(--border); }
  .crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; white-space: nowrap; }
  .crumbs b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--primary); }
  .pl { margin-left: auto; display: flex; align-items: center; gap: var(--s2); min-width: 0;
        background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 3px 3px var(--s3); }
  .pl .label { color: var(--subtle); font-size: 12px; white-space: nowrap; }
  .pl code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
  .content { padding: var(--s5); flex: 1; }

  /* ---------- 通用控件 ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 var(--s3);
         font: inherit; font-size: 13px; font-weight: 500; color: var(--text); background: var(--surface);
         border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; white-space: nowrap;
         transition: background .15s, border-color .15s, color .15s; }
  a.btn { text-decoration: none; }
  .btn.menu-btn { display: none; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.sm { height: 28px; padding: 0 var(--s2); font-size: 12px; }
  .btn.icon { width: 34px; padding: 0; }
  .btn.icon.sm { width: 28px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  @media (pointer: coarse) { .btn { height: 44px; } .btn.icon { width: 44px; } .btn.sm { height: 40px; } .btn.icon.sm { width: 40px; } }
  input[type=search], input[type=text], select, textarea {
    font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); height: 34px; padding: 0 var(--s3); min-width: 0; }
  textarea { height: auto; min-height: 140px; padding: var(--s2) var(--s3); width: 100%; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px var(--primary-soft); }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s4); }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head p { margin: 2px 0 0; color: var(--muted); }
  .toolbar { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap;
                padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); }
  .panel-head h2 { font-size: 15px; margin: 0; }
  .panel-body { padding: var(--s4); }
  .hint { color: var(--muted); font-size: 13px; margin: var(--s2) 0 0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
  .stat { padding: var(--s3) var(--s4); }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- 分区 ---------- */
  .cat-layout { display: grid; grid-template-columns: 200px 1fr; gap: var(--s4); align-items: start; }
  .cat-tops { padding: var(--s2); position: sticky; top: calc(var(--topbar-h) + var(--s4)); }
  .cat-tops button { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; color: var(--text);
                     padding: 7px var(--s3); border-radius: 6px; cursor: pointer; }
  .cat-tops button:hover { background: var(--surface-2); }
  .cat-tops button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .subs { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
  .sub { display: flex; align-items: center; gap: var(--s2); padding: var(--s2); border: 1px solid var(--border); border-radius: var(--radius);
         background: var(--surface); color: var(--text); text-decoration: none; font-size: 13px; transition: border-color .15s, background .15s; min-height: 44px; }
  .sub:hover { border-color: var(--primary); background: var(--primary-soft); }
  .sub img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; background: var(--surface-2); flex: none; }
  .sub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 房间卡片 ---------- */
  .grid { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); }
  .room { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
          display: flex; flex-direction: column; transition: border-color .15s; }
  .room:hover { border-color: var(--subtle); }
  .cover { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag { position: absolute; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 6px;
         border-radius: 4px; background: rgba(15, 23, 42, .72); color: #fff; }
  .tag svg.i { width: 12px; height: 12px; }
  .tag.online { right: 6px; bottom: 6px; }
  .tag.off { left: 6px; top: 6px; }
  .room .meta { padding: var(--s2) var(--s2) var(--s2) var(--s3); display: flex; gap: var(--s1); align-items: center; }
  .room .txt { flex: 1; min-width: 0; }
  .room .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room .user { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
  .star[aria-pressed="true"] svg { fill: currentColor; }
  .more-wrap { display: flex; justify-content: center; margin-top: var(--s4); }
  .state { color: var(--muted); text-align: center; padding: var(--s6) 0; }
  .skeleton { background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%;
              animation: shimmer 1.2s infinite; border-radius: 10px; aspect-ratio: 16 / 13; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- 表格 ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px var(--s3); border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-weight: 600; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; font-size: 12px; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr[aria-selected="true"] { background: var(--primary-soft); }
  td.logo img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; background: var(--surface-2); display: block; }
  td.name { font-weight: 500; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.addr { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  td.ops { white-space: nowrap; text-align: right; }
  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 12px;
           background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .badge.fav { background: #fef3c7; color: #92400e; }
  @media (prefers-color-scheme: dark) { .badge.fav { background: #422006; color: #fcd34d; } }
  .bulkbar[hidden] { display: none; }
  .bulkbar { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); background: var(--primary-soft);
             border-bottom: 1px solid var(--border); }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: var(--s3) var(--s4); color: var(--muted); flex-wrap: wrap; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

  /* ---------- 导入 ---------- */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); align-items: start; }
  .drop { border: 2px dashed var(--border); border-radius: 10px; padding: var(--s5); text-align: center; color: var(--muted);
          cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--primary); background: var(--primary-soft); }
  .drop svg.i { width: 28px; height: 28px; color: var(--primary); }
  .result { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-top: var(--s3); }
  .result div { background: var(--surface-2); border-radius: var(--radius); padding: var(--s2) var(--s3); }
  .result b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .result span { color: var(--muted); font-size: 12px; }
  .preview { margin-top: var(--s3); display: flex; gap: var(--s3); align-items: center; padding: var(--s3);
             border: 1px solid var(--border); border-radius: var(--radius); }
  .preview img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--surface-2); }

  img.broken { visibility: hidden; }
  .ch-jump { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--s3); }
  .ch-jump a { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); text-decoration: none; }
  .ch-jump a:hover { background: var(--primary-soft); color: var(--primary); }
  .ch-sec { margin-bottom: var(--s5); scroll-margin-top: calc(var(--topbar-h) + var(--s3)); }
  .ch-sec h3 { display: flex; align-items: center; gap: var(--s2); font-size: 14px; margin: 0 0 var(--s2); }
  .ch-sec h3 .badge { font-weight: 400; }
  .ch-grid { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); }
  .ch-card { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 60px; padding: var(--s2) var(--s3);
             text-align: left; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
             border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
  .ch-card:hover { border-color: var(--primary); background: var(--primary-soft); }
  .ch-card .logo { position: relative; width: 44px; height: 44px; flex: none; border-radius: 8px; background: var(--surface-2);
                   display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--muted); font-weight: 600; }
  .ch-card .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .ch-card .txt { flex: 1; min-width: 0; }
  .ch-card .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-card .m { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-card .pi { color: var(--muted); opacity: 0; transition: opacity .15s; }
  .ch-card:hover .pi, .ch-card:focus-visible .pi { opacity: 1; color: var(--primary); }
  @media (pointer: coarse) { .ch-card .pi { opacity: .6; } }
  .seg-tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); }
  .seg-tabs button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 0 var(--s3); height: 28px; border-radius: 6px; cursor: pointer; }
  .seg-tabs button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  .anchors { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .anchor { display: flex; align-items: center; gap: var(--s3); padding: var(--s3); background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px; }
  .anchor .ava { position: relative; flex: none; }
  .anchor .ava img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--surface-2); display: block; }
  .anchor .ava .dot { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%;
                      background: var(--ok); border: 2px solid var(--surface); }
  .anchor .txt { flex: 1; min-width: 0; }
  .anchor .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .anchor .m { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live-badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font-size: 11px;
                background: var(--ok); color: #fff; margin-left: 6px; vertical-align: 1px; }
  @media (prefers-color-scheme: dark) { .live-badge { color: #052e16; } }
  button.cover { display: block; width: 100%; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; }
  .cover .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                 background: rgba(15, 23, 42, .35); opacity: 0; transition: opacity .15s; }
  .cover .play svg.i { width: 44px; height: 44px; color: #fff; fill: rgba(255, 255, 255, .9); stroke: none; }
  button.cover:hover .play, button.cover:focus-visible .play { opacity: 1; }
  @media (pointer: coarse) { .cover .play { opacity: .85; background: transparent; } .cover .play svg.i { width: 36px; height: 36px; } }
  dialog#player { width: min(1080px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; border: 1px solid var(--border);
                  border-radius: 12px; background: var(--surface); color: var(--text); overflow: hidden; }
  dialog#player::backdrop { background: rgba(2, 6, 23, .7); }
  .pl-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--border); }
  .pl-head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex: none; }
  .pl-head .txt { flex: 1; min-width: 0; }
  .pl-head .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-head .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-video { position: relative; background: #000; aspect-ratio: 16 / 9; max-height: calc(100vh - 180px); width: 100%; }
  .pl-video video { width: 100%; height: 100%; display: block; background: #000; }
  .pl-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
            padding: var(--s5); color: #e5e7eb; background: rgba(0, 0, 0, .6); font-size: 14px; }
  .pl-msg[hidden] { display: none; }
  .pl-foot { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; padding: var(--s3) var(--s4); }
  .pl-foot .info { color: var(--muted); font-size: 12px; margin-right: auto; }
  #toast { position: fixed; right: var(--s5); bottom: var(--s5); z-index: 50; background: var(--text); color: var(--bg);
           padding: 10px var(--s4); border-radius: var(--radius); font-size: 13px; opacity: 0; transform: translateY(8px);
           transition: opacity .2s, transform .2s; pointer-events: none; max-width: min(420px, calc(100% - 32px)); }
  #toast.show { opacity: 1; transform: none; }
  #toast.err { background: var(--danger); color: #fff; }
  .scrim { display: none; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; z-index: 30; left: 0; top: 0; width: 260px; transform: translateX(-100%); transition: transform .2s; }
    body.nav-open aside { transform: none; }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(15, 23, 42, .45); }
    .btn.menu-btn { display: inline-flex; }
    .topbar { padding: 0 var(--s4); }
    .pl .label, .pl code { display: none; }
    .content { padding: var(--s4); }
    .cat-layout, .two { grid-template-columns: 1fr; }
    .cat-tops { position: static; display: flex; overflow-x: auto; gap: 4px; }
    .cat-tops button { width: auto; white-space: nowrap; }
  }
</style>
</head>
<body>
<!-- 图标：Lucide 路径，内联 SVG，不依赖外网 -->

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const playlistURL = location.origin + "/playlist.m3u";
const state = { sites: [], favs: new Set(), cats: {}, channels: null, lastKw: {} };

// ---------- 工具 ----------
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) e.append(c);
  return e;
}
function icon(name, style) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("class", "i"); s.setAttribute("aria-hidden", "true");
  if (style) s.setAttribute("style", style);
  const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
  u.setAttribute("href", "#i-" + name);
  s.append(u);
  return s;
}
function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.className = ""), isErr ? 4500 : 2200);
}
async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}
const fmtNum = n => !n ? "" : n >= 10000 ? (n / 10000).toFixed(1).replace(/\.0$/, "") + "万" : String(n);
const streamURL = (p, rid) => location.origin + "/" + p + "/" + encodeURIComponent(rid);
const fmtTime = s => { const d = new Date(s * 1000); return `${d.getMonth() + 1}-${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("已复制：" + text); }
  catch (_) { prompt("复制下面的地址", text); }
}
const siteName = id => (state.sites.find(s => s.id === id) || {}).name || id;

// ---------- 路由：#/{平台}/{视图}[/...]，频道管理 #/channels、#/import ----------
// 视图写进地址栏：刷新不丢位置，浏览器"后退"能回到上一个分区。
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent).filter(Boolean);
  if (parts[0] === "channels" || parts[0] === "import") return { view: parts[0] };
  const site = state.sites.some(s => s.id === parts[0]) ? parts[0] : (loadPref().site || state.sites[0].id);
  const view = ["recommend", "category", "search"].includes(parts[1]) ? parts[1] : "recommend";
  return { site, view, a: parts[2], b: parts[3], c: parts[4] };
}
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
function loadPref() { try { return JSON.parse(localStorage.getItem("browse") || "{}"); } catch (_) { return {}; } }
function savePref(site) { try { localStorage.setItem("browse", JSON.stringify({ site })); } catch (_) {} }

// ---------- 收藏 ----------
async function loadFavs() {
  try { state.favs = new Set(await api("/api/favorites")); } catch (e) { toast("读取收藏失败：" + e.message, true); }
}
async function loadCount() {
  try { const chs = await api("/api/channels"); state.channels = chs; $("#navCount").textContent = chs.length || ""; } catch (_) {}
}
async function toggleFav(btn, platform, room) {
  const key = platform + "/" + room.room_id;
  const on = state.favs.has(key);
  btn.disabled = true;
  try {
    if (on) {
      await api(`/api/favorites/${platform}/${encodeURIComponent(room.room_id)}`, { method: "DELETE" });
      state.favs.delete(key);
      toast("已取消收藏：" + (room.user_name || room.room_id));
    } else {
      // 主播名比直播标题稳定（标题天天变），用它作频道名。
      const r = await api(`/api/favorites/${platform}/${encodeURIComponent(room.room_id)}`, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: room.user_name || room.title, logo: room.avatar || "" }),
      });
      state.favs.add(platform + "/" + r.room_id);
      toast(r.added ? "已收藏：" + r.name : "已在频道列表里");
    }
    setStar(btn, !on);
    loadCount();
  } catch (e) {
    toast("操作失败：" + e.message, true);
  } finally {
    btn.disabled = false;
  }
}
function setStar(btn, on) {
  btn.setAttribute("aria-pressed", String(on));
  btn.setAttribute("aria-label", on ? "取消收藏" : "收藏");
  btn.title = on ? "取消收藏" : "收藏";
}

// ---------- 房间卡片与分页 ----------
function roomCard(platform, r) {
  const star = el("button", { class: "btn icon sm star" }, icon("star", "width:16px;height:16px"));
  setStar(star, state.favs.has(platform + "/" + r.room_id));
  star.addEventListener("click", () => toggleFav(star, platform, r));
  return el("article", { class: "room" },
    el("button", { class: "cover", "aria-label": "观看 " + (r.user_name || r.room_id), onclick: () => openPlayer({ platform, room: r }) },
      r.cover ? el("img", { src: r.cover, loading: "lazy", alt: "", referrerpolicy: "no-referrer" }) : null,
      el("span", { class: "play" }, icon("play")),
      r.online ? el("span", { class: "tag online" }, icon("flame"), fmtNum(r.online)) : null,
      r.live === false ? el("span", { class: "tag off" }, "未开播") : null),
    el("div", { class: "meta" },
      el("div", { class: "txt" },
        el("div", { class: "title", title: r.title }, r.title || "（无标题）"),
        el("div", { class: "user" }, `${r.user_name} · ${r.room_id}`)),
      star,
      el("button", { class: "btn icon sm", "aria-label": "复制播放地址", title: "复制播放地址", onclick: () => copy(streamURL(platform, r.room_id)) },
        icon("copy", "width:16px;height:16px"))));
}

// 主播搜索结果：没有封面和标题，未开播的也会返回（可以先收藏，开播后在电视上看）。
function anchorCard(platform, r) {
  const star = el("button", { class: "btn icon sm star" }, icon("star", "width:16px;height:16px"));
  setStar(star, state.favs.has(platform + "/" + r.room_id));
  star.addEventListener("click", () => toggleFav(star, platform, r));
  return el("article", { class: "anchor" },
    el("div", { class: "ava" },
      el("img", { src: r.avatar || "", alt: "", loading: "lazy", referrerpolicy: "no-referrer" }),
      r.live ? el("span", { class: "dot", title: "直播中" }) : null),
    el("div", { class: "txt" },
      el("div", { class: "n", title: r.user_name }, r.user_name, r.live ? el("span", { class: "live-badge" }, "直播中") : null),
      el("div", { class: "m" }, `房间 ${r.room_id}` + (r.online ? ` · 粉丝 ${fmtNum(r.online)}` : ""))),
    r.live ? el("button", { class: "btn icon sm", "aria-label": "观看 " + r.user_name, title: "观看", onclick: () => openPlayer({ platform, room: r }) }, icon("play", "width:16px;height:16px")) : null,
    star);
}

// pager：fetchPage(page) → {has_more, items}；翻页去重（列表在翻页期间会变动）。
function pager(container, platform, fetchPage, card = roomCard, gridClass = "grid") {
  const grid = el("div", { class: gridClass }, ...Array.from({ length: gridClass === "grid" ? 10 : 0 }, () => el("div", { class: "skeleton" })));
  if (gridClass !== "grid") grid.append(el("div", { class: "state", style: "grid-column:1/-1" }, "搜索中…"));
  const moreWrap = el("div", { class: "more-wrap" });
  container.append(grid, moreWrap);
  let page = 1, first = true;
  const seen = new Set();
  async function next(btn) {
    if (btn) { btn.disabled = true; btn.textContent = "加载中…"; }
    try {
      const data = await fetchPage(page);
      if (first) { grid.replaceChildren(); first = false; }
      for (const r of data.items) {
        if (seen.has(r.room_id)) continue;
        seen.add(r.room_id);
        grid.append(card(platform, r));
      }
      moreWrap.replaceChildren();
      if (!grid.children.length) grid.replaceWith(el("div", { class: "state" }, "没有直播间"));
      else if (data.has_more && data.items.length) {
        page++;
        const b = el("button", { class: "btn" }, "加载更多");
        b.addEventListener("click", () => next(b));
        moreWrap.append(b);
      }
    } catch (e) {
      if (first) grid.replaceWith(el("div", { class: "state" }, "加载失败：" + e.message));
      else { toast("加载失败：" + e.message, true); if (btn) { btn.disabled = false; btn.textContent = "重试"; } }
    }
  }
  next();
}

// ---------- 视图 ----------
function head(title, desc, ...tools) {
  return el("div", { class: "page-head" },
    el("div", {}, el("h1", {}, title), desc ? el("p", {}, desc) : null),
    tools.length ? el("div", { class: "toolbar" }, ...tools) : null);
}

function viewRecommend(v, r) {
  setCrumbs([siteName(r.site), "推荐"]);
  v.append(head("推荐", siteName(r.site) + " 正在直播的热门房间。点星标收藏，频道会出现在播放列表里。",
    el("button", { class: "btn", onclick: () => render() }, icon("refresh", "width:16px;height:16px"), "刷新")));
  pager(v, r.site, page => api(`/api/sites/${r.site}/recommend?page=${page}`));
}

async function viewCategory(v, r) {
  const p = r.site;
  // #/{p}/category/{top}/{subId}/{parentId}
  if (r.b) {
    const cats = state.cats[p] || [];
    const top = cats.find(c => c.id === r.a);
    const sub = top && (top.children || []).find(s => s.id === r.b);
    const name = sub ? sub.name : "分区 " + r.b;
    setCrumbs([siteName(p), { text: "分区", href: `#/${p}/category/${r.a}` }, name]);
    v.append(head(name, top ? top.name : "",
      el("a", { class: "btn", href: `#/${p}/category/${r.a}` }, icon("back", "width:16px;height:16px"), "返回分区")));
    const q = `id=${encodeURIComponent(r.b)}&parent=${encodeURIComponent(r.c || (sub && sub.parent_id) || r.a || "")}`;
    pager(v, p, page => api(`/api/sites/${p}/rooms?${q}&page=${page}`));
    if (!state.cats[p]) loadCats(p).then(() => { if (location.hash.includes("/category/")) setCrumbsForSub(p, r); });
    return;
  }
  setCrumbs([siteName(p), "分区"]);
  v.append(head("分区", "选择左侧一级分区，再点二级分区查看正在直播的房间。"));
  const body = el("div", { class: "state" }, "加载分区…");
  v.append(body);
  let cats;
  try { cats = await loadCats(p); }
  catch (e) { body.textContent = "加载分区失败：" + e.message; return; }
  const top = cats.find(c => c.id === r.a) || cats[0];
  const tops = el("div", { class: "panel cat-tops", role: "group", "aria-label": "一级分区" },
    ...cats.map(c => el("button", { "aria-pressed": String(c === top), onclick: () => go(`#/${p}/category/${c.id}`) }, c.name)));
  const subs = (top.children || []).filter(s => s.id && s.id !== "0");
  const grid = el("div", { class: "subs" }, ...subs.map(s =>
    el("a", { class: "sub", href: `#/${p}/category/${top.id}/${encodeURIComponent(s.id)}/${encodeURIComponent(s.parent_id || top.id)}` },
      s.pic ? el("img", { src: s.pic, loading: "lazy", alt: "", referrerpolicy: "no-referrer" }) : el("img", { alt: "" }),
      el("span", { title: s.name }, s.name))));
  body.replaceWith(el("div", { class: "cat-layout" }, tops,
    el("section", { class: "panel" },
      el("div", { class: "panel-head" }, el("h2", {}, top.name), el("span", { class: "badge" }, subs.length + " 个分区")),
      el("div", { class: "panel-body" }, subs.length ? grid : el("div", { class: "state" }, "没有二级分区")))));
}
async function loadCats(p) {
  if (!state.cats[p]) state.cats[p] = await api(`/api/sites/${p}/categories`);
  return state.cats[p];
}
function setCrumbsForSub(p, r) {
  const top = (state.cats[p] || []).find(c => c.id === r.a);
  const sub = top && (top.children || []).find(s => s.id === r.b);
  if (sub) setCrumbs([siteName(p), { text: "分区", href: `#/${p}/category/${r.a}` }, sub.name]);
}

// #/{p}/search/{关键词}[/user]：带 /user 时按主播搜索。
function viewSearch(v, r) {
  const p = r.site;
  const kw = r.a || "";
  const byUser = r.b === "user" || (!kw && state.searchUser);
  state.searchUser = byUser;
  setCrumbs([siteName(p), "搜索", ...(kw ? [(byUser ? "主播：" : "") + kw] : [])]);
  const input = el("input", { type: "search", placeholder: byUser ? "主播昵称" : "房间标题或主播名", value: kw, "aria-label": "搜索关键词", style: "width:260px" });
  const target = (k, user) => `#/${p}/search/${encodeURIComponent(k)}` + (user ? "/user" : "");
  const submit = () => { const k = input.value.trim(); if (k) go(target(k, byUser)); };
  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  const mode = el("div", { class: "seg-tabs", role: "group", "aria-label": "搜索类型" },
    ...[["直播间", false], ["主播", true]].map(([label, user]) => el("button", { "aria-pressed": String(user === byUser), onclick: () => {
      state.searchUser = user;
      const k = input.value.trim();
      if (k) go(target(k, user)); else render();
    } }, label)));
  v.append(head("搜索", byUser ? `在 ${siteName(p)} 按主播昵称搜索，未开播的主播也能收藏。` : `在 ${siteName(p)} 搜索正在直播的房间。`, mode, input,
    el("button", { class: "btn primary", onclick: submit }, icon("search", "width:16px;height:16px"), "搜索")));
  const q = page => api(`/api/sites/${p}/search?kw=${encodeURIComponent(kw)}&page=${page}` + (byUser ? "&type=user" : ""));
  if (kw) byUser ? pager(v, p, q, anchorCard, "anchors") : pager(v, p, q);
  else v.append(el("div", { class: "state" }, "输入关键词后回车"));
  input.focus();
}

async function viewChannels(v) {
  setCrumbs(["频道管理", "频道列表"]);
  v.append(head("频道列表", "收藏与导入的全部频道，按分组平铺，点卡片即可观看；表格视图用于批量管理。",
    el("a", { class: "btn", href: "#/import" }, icon("plus", "width:16px;height:16px"), "导入与添加")));
  const box = el("div", { class: "state" }, "加载中…");
  v.append(box);
  let chs;
  try { chs = await api("/api/channels"); state.channels = chs; $("#navCount").textContent = chs.length || ""; }
  catch (e) { box.textContent = "加载失败：" + e.message; return; }

  const groups = [...new Set(chs.map(c => c.group || "未分组"))];
  const favN = chs.filter(c => c.source === "favorite").length;
  const stats = el("div", { class: "stats" },
    ...[["频道总数", chs.length], ["收藏的直播间", favN], ["导入的频道", chs.length - favN], ["分组", groups.length]]
      .map(([k, n]) => el("div", { class: "panel stat" }, el("div", { class: "k" }, k), el("div", { class: "v" }, String(n)))));

  const q = el("input", { type: "search", placeholder: "按名称或地址筛选", "aria-label": "筛选频道", style: "width:220px" });

// ---------- 播放 ----------
// 播放库体积大（mpegts.js 270KB、hls.js 600KB），第一次打开播放器时才加载。
const libs = {};
function loadLib(src) {
  return libs[src] ||= new Promise((ok, fail) => {
    const s = el("script", { src });
    s.onload = ok;
    s.onerror = () => { delete libs[src]; fail(new Error("加载播放库失败：" + src)); };
    document.head.append(s);
  });
}
let engine = null; // 当前的 mpegts/hls 实例，切换线路或关闭时销毁
let stallTimer = 0;
function stopEngine() {
  const v = $("#plVideo");
  clearTimeout(stallTimer);
  if (engine) { try { engine.destroy(); } catch (_) {} engine = null; }
  v.pause(); v.removeAttribute("src"); v.load();
}
function showMsg(text) { const m = $("#plMsg"); m.textContent = text || ""; m.hidden = !text; }

// 浏览器解码能力有限：MP2 音频、部分 HEVC 播不了，此时给出明确提示而不是一直黑屏转圈。
const codecHint = "浏览器可能不支持这个频道的音视频编码（常见于组播的 MP2 音频或 HEVC 画面），电视上的播放器通常可以正常播放。";

async function playURL(kind, url) {
  stopEngine();
  showMsg("连接中…");
  const v = $("#plVideo");
  // 慢源或失效源有时既不报错也不出画面，不给结论会让人一直等。
  stallTimer = setTimeout(() => {
    if (v.currentTime === 0 && /连接中/.test($("#plMsg").textContent))
      showMsg("20 秒内没有收到画面：源可能很慢、需要境外网络或已失效。可以稍后重试，或在电视上观看。");
  }, 20000);
  const abs = new URL(url, location.origin).href;
  try {
    if (kind === "hls") {
      await loadLib("/static/hls.min.js");
      if (window.Hls && Hls.isSupported()) {
        const h = engine = new Hls({ liveDurationInfinity: true });
        h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) showMsg("播放失败：" + (d.details || d.type) + "。" + (d.type === "mediaError" ? codecHint : "源可能已失效。")); });
        h.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
        h.loadSource(abs); h.attachMedia(v);
      } else if (v.canPlayType("application/vnd.apple.mpegurl")) {
        v.src = abs; await v.play().catch(() => {});
      } else throw new Error("当前浏览器不支持 HLS 播放");
    } else {
      await loadLib("/static/mpegts.js");
      if (!window.mpegts || !mpegts.isSupported()) throw new Error("当前浏览器不支持 MSE，无法播放");
      const p = engine = mpegts.createPlayer({ type: kind, isLive: true, url: abs },
        { enableWorker: false, lazyLoad: false, liveBufferLatencyChasing: true, autoCleanupSourceBuffer: true });
      p.on(mpegts.Events.ERROR, (type, detail, info) => {
        const media = type === mpegts.ErrorTypes.MEDIA_ERROR;
        showMsg("播放失败：" + (detail || type) + (info && info.msg ? "（" + info.msg + "）" : "") + "。" + (media ? codecHint : "主播可能已下播，或线路不可用，换条线路试试。"));
      });
      p.on(mpegts.Events.MEDIA_INFO, mi => {
        if (mi && mi.hasAudio === false && kind === "mpegts") toast("这个频道没有可播放的音轨（浏览器不支持其音频编码）", true);
      });
      p.attachMediaElement(v); p.load();
      await p.play();
    }
  } catch (e) {
    if (e && e.name === "NotAllowedError") { showMsg("点击画面开始播放"); return; }
    if (e && e.message) showMsg(e.message);
  }
}

async function openPlayer({ platform, room, channel }) {
  const dlg = $("#player"), foot = $("#plFoot");
  if (channel && channel.platform) { platform = channel.platform; room = { room_id: channel.room_id, user_name: channel.name, avatar: channel.logo }; }
  const title = room ? (room.user_name || room.room_id) : channel.name;
  $("#plTitle").textContent = title;
  $("#plSub").textContent = room ? `${siteName(platform)} · ${room.room_id}${room.title ? " · " + room.title : ""}` : `${channel.group || "未分组"} · ${channel.url}`;
  const av = $("#plAvatar"); av.classList.remove("broken");
  const pic = room ? room.avatar : channel.logo;
  av.hidden = !pic; if (pic) av.src = pic;
  foot.replaceChildren();
  showMsg("");
  if (!dlg.open) dlg.showModal();
  $("#plClose").focus();

  const copyBtn = (u) => el("button", { class: "btn sm", onclick: () => copy(u) }, icon("copy", "width:14px;height:14px"), "复制地址");
  if (room) {
    const star = el("button", { class: "btn sm star" }, icon("star", "width:14px;height:14px"), "收藏");
    setStar(star, state.favs.has(platform + "/" + room.room_id));
    star.addEventListener("click", () => toggleFav(star, platform, room));
    const info = el("span", { class: "info" }, "获取线路…");
    const sel = el("select", { "aria-label": "线路", disabled: true });
    foot.append(info, sel, star, copyBtn(streamURL(platform, room.room_id)));
    showMsg("获取线路…");
    let lines;
    try {
      const r = await fetch(`/${platform}/${encodeURIComponent(room.room_id)}?format=json`);
      if (!r.ok) throw new Error((await r.text()).trim() || "HTTP " + r.status);
      lines = (await r.json()).streams || [];
    } catch (e) { info.textContent = ""; showMsg("无法播放：" + e.message); return; }
    // 浏览器里统一走中转播 FLV：同源无跨域，断线由服务端续接。没有 FLV 的才退回 HLS 直连。
    const flv = [], seen = new Set();
    for (const s of lines) if (s.format === "flv" && !seen.has(s.cdn)) { seen.add(s.cdn); flv.push(s); }
    const base = `/${platform}/${encodeURIComponent(room.room_id)}`;
    // 第一项"自动"不指定线路，由服务端每次取流时挑最佳。B站每次取流分到的 CDN 节点名都不同
    // （cn-sccd-ct-02-13 下一次就成了 -06），按名字指定必然 404，所以 B站只给"自动"。
    const pinned = platform === "bilibili" ? [] : flv.map(s => ({ label: `${s.cdn} · ${s.quality}`, kind: "flv", url: `${base}?relay=1&cdn=${encodeURIComponent(s.cdn)}` }));
    const opts = flv.length ? [{ label: `自动 · ${flv[0].quality}`, kind: "flv", url: `${base}?relay=1` }, ...pinned]
                            : lines.filter(s => s.format === "m3u8").map(s => ({ label: `${s.cdn} · ${s.quality}（HLS）`, kind: "hls", url: s.url }));
    if (!opts.length) { showMsg("没有浏览器能播放的线路"); return; }
    sel.replaceChildren(...opts.map((o, i) => el("option", { value: String(i) }, o.label)));
    sel.disabled = opts.length < 2;
    sel.onchange = () => playURL(opts[+sel.value].kind, opts[+sel.value].url);
    info.textContent = `${opts.length} 条线路` + (flv.length ? " · 经本机中转" : "");
    playURL(opts[0].kind, opts[0].url);
    return;
  }

  const info = el("span", { class: "info" }, "识别格式…");
  foot.append(info, copyBtn(channel.url));
  showMsg("识别格式…");
  try {
    const p = await api(`/api/channels/${channel.id}/probe`);
    info.textContent = { hls: "HLS", flv: "FLV", mpegts: "MPEG-TS" }[p.kind] + " · 经本机代理";
    playURL(p.kind, p.url);
  } catch (e) {
    info.textContent = "";
    showMsg("无法播放：" + e.message);
  }
}
function closePlayer() { stopEngine(); showMsg(""); const d = $("#player"); if (d.open) d.close(); }

// ---------- 渲染 ----------
function setCrumbs(items) {
  $("#crumbs").replaceChildren(...items.flatMap((it, i) => {
    const last = i === items.length - 1;
    const node = typeof it === "string" ? (last ? el("b", {}, it) : el("span", {}, it)) : el("a", { href: it.href }, it.text);
    return i ? [icon("chev", "width:14px;height:14px;opacity:.6"), node] : [node];
  }));
  document.title = items.map(i => typeof i === "string" ? i : i.text).reverse().join(" · ") + " · 直播管理";
}

function render() {
  const r = parseRoute();
  const isBrowse = r.view !== "channels" && r.view !== "import";
  const site = isBrowse ? r.site : (loadPref().site || state.sites[0].id);
  if (isBrowse) savePref(site);
  for (const b of $("#sites").children) b.setAttribute("aria-pressed", String(b.dataset.id === site));
  for (const a of document.querySelectorAll(".nav a")) {
    const view = a.dataset.view;
    if (["recommend", "category", "search"].includes(view)) a.href = `#/${site}/${view}`;
    a.toggleAttribute("aria-current", view === r.view);
    if (view === r.view) a.setAttribute("aria-current", "page");
  }
  document.body.classList.remove("nav-open");
  const v = $("#view");
  v.replaceChildren();
  ({ recommend: viewRecommend, category: viewCategory, search: viewSearch, channels: viewChannels, import: viewImport })[r.view](v, r);
}

async function init() {
  $("#plUrl").textContent = playlistURL;
  $("#plCopy").addEventListener("click", () => copy(playlistURL));
  $("#menuBtn").addEventListener("click", () => document.body.classList.add("nav-open"));
  $("#plClose").addEventListener("click", closePlayer);
  // Esc 关闭、点遮罩关闭时也要停流：不停的话中转和组播连接会在后台一直占着。
  $("#player").addEventListener("close", () => stopEngine());
  // 真正出画面时才撤掉"连接中"；出错提示由播放库的错误回调覆盖上去。
  $("#plVideo").addEventListener("playing", () => showMsg(""));
  $("#player").addEventListener("click", e => { if (e.target === e.currentTarget) closePlayer(); });
  $("#scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));
  try { state.sites = await api("/api/sites"); }
  catch (e) { $("#view").replaceChildren(el("div", { class: "state" }, "加载平台失败：" + e.message)); return; }
  for (const s of state.sites) {
    $("#sites").append(el("button", { "data-id": s.id, title: s.name, onclick: () => {
      const r = parseRoute();
      const view = ["recommend", "category", "search"].includes(r.view) ? r.view : "recommend";
      savePref(s.id);
      go(`#/${s.id}/${view}`);
    } }, s.name.replace(/直播$/, "").replace("哔哩哔哩", "B站")));
  }
  await loadFavs();
  loadCount();
  window.addEventListener("hashchange", render);
  render();
}
// 台标、封面都来自外部站点，失效时不显示破图图标，只留占位底色。
document.addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.classList.add("broken"); }, true);
init();
</script>
</body>
